name: release-binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            suffix: .exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
            suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            suffix: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package service binaries
        shell: bash
        run: |
          python scripts/package_release.py \
            --version "${GITHUB_REF_NAME:-manual}" \
            --target "${{ matrix.target }}" \
            --platform "${{ matrix.platform }}" \
            --suffix "${{ matrix.suffix }}"

      - name: Smoke test packaged service
        shell: bash
        run: |
          python scripts/smoke_release.py \
            --artifacts artifacts \
            --binary "captcha-service${{ matrix.suffix }}" \
            --port-env CAPTCHA_SERVICE_PORT \
            --port 18765

      - uses: actions/upload-artifact@v7
        with:
          name: ai-scraping-defense-rust-${{ matrix.platform }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          if-no-files-found: error

  publish:
    name: Publish native binaries
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ai-scraping-defense-rust-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Summarize binaries
        shell: bash
        run: |
          {
            echo "Published native release bundles:"
            for artifact in artifacts/*; do
              echo "- \`$(basename "$artifact")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
