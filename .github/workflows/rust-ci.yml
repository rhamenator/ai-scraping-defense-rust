name: rust-ci

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard patched dependency versions
        run: python3 scripts/test_dependency_floor.py
      - name: Check sample environment and authenticated examples
        shell: sh
        run: |
          python3 scripts/test_quickstart.py
          set -a
          . ./config/sample.env
          test "$ADMIN_UI_WEBAUTHN_RP_NAME" = "AI Scraping Defense Admin"
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        env:
          TARPIT_TEST_REDIS_URL: redis://127.0.0.1:6379/
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100
      - name: Install locked audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit resolved dependencies
        run: cargo audit
