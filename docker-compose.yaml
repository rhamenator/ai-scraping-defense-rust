x-cloudflare-env: &cloudflare-env
  ENABLE_GLOBAL_CDN: "${ENABLE_GLOBAL_CDN:-false}"
  CLOUD_CDN_PROVIDER: "${CLOUD_CDN_PROVIDER:-cloudflare}"
  SECURITY_CDN_TRUSTED_PROXY_CIDRS: "${SECURITY_CDN_TRUSTED_PROXY_CIDRS:-}"
  SECURITY_TRUSTED_PROXY_CIDRS: "${SECURITY_TRUSTED_PROXY_CIDRS:-}"

services:
  escalation-engine:
    build: .
    command: ["/usr/local/bin/escalation-engine"]
    environment:
      <<: *cloudflare-env
      ESCALATION_ENGINE_PORT: "8002"
      ESCALATION_THRESHOLD: "0.70"
      ESCALATION_THROTTLE_THRESHOLD: "0.72"
      ESCALATION_TARPIT_THRESHOLD: "0.82"
      ESCALATION_BLOCK_THRESHOLD: "0.92"
      DETECTION_MODEL_PATH: "${DETECTION_MODEL_PATH:-/models/detection-model.json}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"
      REDIS_DB_FREQUENCY: "0"
      REDIS_DB_BLOCKLIST: "0"
      RUST_LOG: info
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
      ESCALATION_API_KEY: "${ESCALATION_API_KEY:?Run python scripts/configure_credentials.py}"
      INCIDENT_EVALUATOR_URL: "http://config-recommender:8007/incident/evaluate"
      INCIDENT_EVALUATOR_API_KEY: "${INCIDENT_EVALUATOR_API_KEY:-}"
      INCIDENT_SITE_ID: "${INCIDENT_SITE_ID:-default-site}"
      INCIDENT_MAX_WINDOW_SECONDS: "${INCIDENT_MAX_WINDOW_SECONDS:-300}"
      INCIDENT_MAX_SAMPLES: "${INCIDENT_MAX_SAMPLES:-10000}"
      CLOUDFLARE_ATTACK_RECOMMENDATION_MIN_REQUESTS: "${CLOUDFLARE_ATTACK_RECOMMENDATION_MIN_REQUESTS:-100}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      TLS_FINGERPRINT_ATTESTATION_KEY: "${TLS_FINGERPRINT_ATTESTATION_KEY:-}"
      TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY: "${TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY:-}"
      TLS_FINGERPRINT_ATTESTATION_MAX_AGE_SECONDS: "${TLS_FINGERPRINT_ATTESTATION_MAX_AGE_SECONDS:-60}"
    # Shared with rag-trainer so a persisted training run can be activated via
    # POST /admin/reload_model without copying artifacts between containers.
    volumes:
      - detection-model:/models
    ports:
      - "8002:8002"

  ai-service:
    build: .
    command: ["/usr/local/bin/ai-service"]
    environment:
      <<: *cloudflare-env
      AI_SERVICE_PORT: "8001"
      WEBHOOK_SHARED_SECRET: "${WEBHOOK_SHARED_SECRET:?Run python scripts/configure_credentials.py}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"
      REDIS_DB_BLOCKLIST: "0"
      RUST_LOG: info
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
    ports:
      - "8001:8001"

  tarpit-api:
    build: .
    command: ["/usr/local/bin/tarpit-api"]
    environment:
      TARPIT_API_PORT: "8003"
      RUST_LOG: info
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
    ports:
      - "8003:8003"

  admin-ui:
    build: .
    command: ["/usr/local/bin/admin-ui"]
    environment:
      <<: *cloudflare-env
      ADMIN_UI_PORT: "8004"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"
      REDIS_DB_BLOCKLIST: "0"
      RUST_LOG: info
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
      ADMIN_UI_SSO_ENABLED: "${ADMIN_UI_SSO_ENABLED:-false}"
      ADMIN_UI_SSO_MODE: "${ADMIN_UI_SSO_MODE:-oidc}"
      ADMIN_UI_OIDC_ISSUER: "${ADMIN_UI_OIDC_ISSUER:-}"
      ADMIN_UI_OIDC_AUDIENCE: "${ADMIN_UI_OIDC_AUDIENCE:-}"
      ADMIN_UI_OIDC_DISCOVERY_URL: "${ADMIN_UI_OIDC_DISCOVERY_URL:-}"
      ADMIN_UI_OIDC_JWKS_URL: "${ADMIN_UI_OIDC_JWKS_URL:-}"
      ADMIN_UI_OIDC_ALLOWED_ALGORITHMS: "${ADMIN_UI_OIDC_ALLOWED_ALGORITHMS:-RS256,RS384,RS512,PS256,PS384,PS512,ES256,ES384,EdDSA}"
      ADMIN_UI_WEBAUTHN_ORIGIN: "${ADMIN_UI_WEBAUTHN_ORIGIN:-http://localhost:8004}"
      ADMIN_UI_WEBAUTHN_RP_ID: "${ADMIN_UI_WEBAUTHN_RP_ID:-localhost}"
      ADMIN_UI_WEBAUTHN_RP_NAME: "${ADMIN_UI_WEBAUTHN_RP_NAME:-AI Scraping Defense Admin}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
    ports:
      - "8004:8004"

  captcha-service:
    build: .
    command: ["/usr/local/bin/captcha-service"]
    environment:
      CAPTCHA_SERVICE_PORT: "8005"
      CAPTCHA_TOKEN_SECRET: "${CAPTCHA_TOKEN_SECRET:?Run python scripts/configure_credentials.py}"
      RUST_LOG: info
    ports:
      - "8005:8005"

  cloud-dashboard:
    build: .
    command: ["/usr/local/bin/cloud-dashboard"]
    environment:
      CLOUD_DASHBOARD_PORT: "8006"
      CLOUD_DASHBOARD_API_KEY: "${CLOUD_DASHBOARD_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      RUST_LOG: info
    ports:
      - "8006:8006"

  config-recommender:
    build: .
    command: ["/usr/local/bin/config-recommender"]
    environment:
      <<: *cloudflare-env
      CONFIG_RECOMMENDER_PORT: "8007"
      CLOUDFLARE_ATTACK_RECOMMENDATION_MIN_REQUESTS: "${CLOUDFLARE_ATTACK_RECOMMENDATION_MIN_REQUESTS:-100}"
      CLOUDFLARE_ATTACK_RECOMMENDATION_MIN_BOT_RATIO: "${CLOUDFLARE_ATTACK_RECOMMENDATION_MIN_BOT_RATIO:-0.25}"
      INCIDENT_EVALUATOR_API_KEY: "${INCIDENT_EVALUATOR_API_KEY:-}"
      INCIDENT_MAX_WINDOW_SECONDS: "${INCIDENT_MAX_WINDOW_SECONDS:-300}"
      INCIDENT_MIN_UNIQUE_SOURCES: "${INCIDENT_MIN_UNIQUE_SOURCES:-20}"
      INCIDENT_ALERT_COOLDOWN_SECONDS: "${INCIDENT_ALERT_COOLDOWN_SECONDS:-900}"
      INCIDENT_PRIMARY_HEALTH_URL: "${INCIDENT_PRIMARY_HEALTH_URL:-}"
      INCIDENT_BACKUP_HEALTH_URL: "${INCIDENT_BACKUP_HEALTH_URL:-}"
      ADMIN_ALERT_WEBHOOK_URL: "${ADMIN_ALERT_WEBHOOK_URL:-}"
      ADMIN_ALERT_WEBHOOK_BEARER_TOKEN: "${ADMIN_ALERT_WEBHOOK_BEARER_TOKEN:-}"
      RUST_LOG: info
    ports:
      - "8007:8007"

  cloud-proxy:
    build: .
    command: ["/usr/local/bin/cloud-proxy"]
    environment:
      <<: *cloudflare-env
      CLOUD_PROXY_PORT: "8008"
      CLOUD_PROXY_API_KEY: "${CLOUD_PROXY_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      CLOUD_MODEL_API_URL: "${CLOUD_MODEL_API_URL:-}"
      CLOUD_MODEL_API_KEY: "${CLOUD_MODEL_API_KEY:-}"
      MODEL_PROVIDER_TIMEOUT_SECONDS: "${MODEL_PROVIDER_TIMEOUT_SECONDS:-30}"
      MODEL_PROVIDER_MAX_RESPONSE_BYTES: "${MODEL_PROVIDER_MAX_RESPONSE_BYTES:-4194304}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-generic-http}"
      MODEL_NAME: "${MODEL_NAME:-default}"
      MODEL_URI: "${MODEL_URI:-}"
      MCP_SERVER_PRIMARY_TRANSPORT: "${MCP_SERVER_PRIMARY_TRANSPORT:-ws}"
      MCP_SERVER_PRIMARY_URL: "${MCP_SERVER_PRIMARY_URL:-}"
      MCP_SERVER_PRIMARY_AUTH_TOKEN: "${MCP_SERVER_PRIMARY_AUTH_TOKEN:-}"
      MCP_SERVER_PRIMARY_TIMEOUT: "${MCP_SERVER_PRIMARY_TIMEOUT:-10}"
      ANTHROPIC_VERSION: "${ANTHROPIC_VERSION:-2023-06-01}"
      TLS_FINGERPRINT_ATTESTATION_KEY: "${TLS_FINGERPRINT_ATTESTATION_KEY:-}"
      TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY: "${TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY:-}"
      TLS_FINGERPRINT_ATTESTATION_MAX_AGE_SECONDS: "${TLS_FINGERPRINT_ATTESTATION_MAX_AGE_SECONDS:-60}"
      RUST_LOG: info
    ports:
      - "8008:8008"

  prompt-router:
    build: .
    command: ["/usr/local/bin/prompt-router"]
    environment:
      PROMPT_ROUTER_PORT: "8009"
      PROMPT_ROUTER_API_KEY: "${PROMPT_ROUTER_API_KEY:?Run python scripts/configure_credentials.py}"
      CLOUD_PROXY_API_KEY: "${CLOUD_PROXY_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      CLOUD_PROXY_URL: "http://cloud-proxy:8008/api/chat"
      LOCAL_MODEL_TARGET: "${LOCAL_MODEL_TARGET:-local-inference}"
      MAX_LOCAL_TOKENS: "2048"
      RUST_LOG: info
    ports:
      - "8009:8009"

  public-blocklist:
    build: .
    command: ["/usr/local/bin/public-blocklist"]
    environment:
      <<: *cloudflare-env
      PUBLIC_BLOCKLIST_PORT: "8011"
      PUBLIC_BLOCKLIST_API_KEY: "${PUBLIC_BLOCKLIST_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"
      REDIS_DB_BLOCKLIST: "0"
      RUST_LOG: info
    ports:
      - "8011:8011"

  pay-per-crawl:
    build: .
    command: ["/usr/local/bin/pay-per-crawl"]
    environment:
      PAY_PER_CRAWL_PORT: "8012"
      PAYMENT_GATEWAY_URL: "${PAYMENT_GATEWAY_URL:-}"
      PAYMENT_PROVIDER: "${PAYMENT_PROVIDER:-generic-http}"
      PAYMENT_API_KEY: "${PAYMENT_API_KEY:-}"
      PAYMENT_CURRENCY: "${PAYMENT_CURRENCY:-usd}"
      PAY_PER_CRAWL_DEFAULT_CHARGE: "${PAY_PER_CRAWL_DEFAULT_CHARGE:-0.01}"
      PAY_PER_CRAWL_API_KEY: "${PAY_PER_CRAWL_API_KEY:?Run python scripts/configure_credentials.py}"
      PAY_PER_CRAWL_MAX_BODY_BYTES: "${PAY_PER_CRAWL_MAX_BODY_BYTES:-10485760}"
      PAY_PER_CRAWL_MAX_RESPONSE_BYTES: "${PAY_PER_CRAWL_MAX_RESPONSE_BYTES:-10485760}"
      REAL_BACKEND_HOST: "${REAL_BACKEND_HOST:-}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
      RUST_LOG: info
    ports:
      - "8012:8012"

  edge-ops:
    build: .
    command: ["/usr/local/bin/edge-ops"]
    environment:
      <<: *cloudflare-env
      EDGE_OPS_PORT: "8013"
      EDGE_OPS_API_KEY: "${EDGE_OPS_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"
      REDIS_DB_BLOCKLIST: "0"
      REAL_BACKEND_HOST: "${REAL_BACKEND_HOST:-https://example.com}"
      RULES_URL: "${RULES_URL:-}"
      EDGE_ALLOWED_DOMAINS: "${EDGE_ALLOWED_DOMAINS:-}"
      CDN_PURGE_URL: "${CDN_PURGE_URL:-}"
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
      RUST_LOG: info
    ports:
      - "8013:8013"

  rag-trainer:
    build: .
    command: ["/usr/local/bin/rag-trainer"]
    environment:
      RAG_TRAINER_PORT: "8014"
      RAG_TRAINER_API_KEY: "${RAG_TRAINER_API_KEY:?Run python scripts/configure_credentials.py}"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ISSUER: "${JWT_ISSUER:-}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-}"
      DETECTION_MODEL_PATH: "${DETECTION_MODEL_PATH:-/models/detection-model.json}"
      POSTGRES_ENABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DBNAME: "${PG_DBNAME:-markovdb}"
      PG_USER: "${PG_USER:-markovuser}"
      PG_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
      RUST_LOG: info
    volumes:
      - detection-model:/models
    # Training ingest/train/export endpoints are deliberately not published to
    # the host; reach them from inside the compose network only.
    expose:
      - "8014"

  # One-off ops client for calling rag-trainer's in-network-only endpoints,
  # e.g. to persist a trained model (see config/sample.env). Scoped to this
  # compose project's own network (never a hardcoded name, so it can't
  # collide with an unrelated project's network) and only starts when
  # explicitly requested: `docker compose --profile ops run --rm train-model
  # -sS -X POST http://rag-trainer:8014/training/train ...`. Image is
  # version-pinned, not `:latest`.
  train-model:
    image: curlimages/curl:8.11.1
    profiles: ["ops"]
    entrypoint: ["curl"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Run python scripts/configure_credentials.py}"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "${PG_USER:-markovuser}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:?Run python scripts/configure_credentials.py}"
      POSTGRES_DB: "${PG_DBNAME:-markovdb}"

volumes:
  detection-model:
