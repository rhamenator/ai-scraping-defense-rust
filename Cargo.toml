[workspace]
resolver = "2"
members = [
    "crates/asd-core",
    "crates/asd-detection",
    "crates/asd-providers",
    "crates/asd-tarpit",
    "services/admin-ui",
    "services/ai-service",
    "services/captcha-service",
    "services/cloud-dashboard",
    "services/cloud-proxy",
    "services/config-recommender",
    "services/escalation-engine",
    "services/edge-ops",
    "services/pay-per-crawl",
    "services/prompt-router",
    "services/public-blocklist",
    "services/rag-trainer",
    "services/tarpit-api",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
aws-lc-rs = "1.18"
axum = { version = "0.7", features = ["macros", "ws"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-http = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace"] }
# Force the WebAuthn dependency's OpenSSL backend to build portably on native runners.
openssl = { version = "0.10", features = ["vendored"] }
rand = "0.10"
redis = { version = "0.32", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", features = ["trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
futures-util = "0.3"
