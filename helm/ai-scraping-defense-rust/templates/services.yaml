{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["{{ $svc.command }}"]
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
          {{- if or (eq $name "cloud-proxy") (eq $name "escalation-engine") }}
          env:
            - name: TLS_FINGERPRINT_ATTESTATION_MAX_AGE_SECONDS
              value: {{ $.Values.tlsFingerprints.maxAgeSeconds | quote }}
            {{- if $.Values.tlsFingerprints.attestationSecretName }}
            - name: TLS_FINGERPRINT_ATTESTATION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.tlsFingerprints.attestationSecretName }}
                  key: {{ $.Values.tlsFingerprints.attestationKeyKey }}
            - name: TLS_FINGERPRINT_ATTESTATION_PREVIOUS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.tlsFingerprints.attestationSecretName }}
                  key: {{ $.Values.tlsFingerprints.previousAttestationKeyKey }}
                  optional: true
            {{- end }}
          {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  selector:
    app: {{ $.Release.Name }}-{{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
